<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Martin Luther King Jr. — 3D AR Experience</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue:    #1A4F8A;
      --gold:    #C8972A;
      --deep:    #080C14;
      --cream:   #EEF0F5;
      --stone:   #7A8799;
      --white:   #F4F6FA;
      --accent:  #4A90D9;
    }
    html, body { height: 100%; background: var(--deep); color: var(--cream); font-family: 'Jost', sans-serif; font-weight: 300; overflow-x: hidden; }

    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 32px;
      background: linear-gradient(to bottom, rgba(8,12,20,0.97), transparent);
    }
    .logo { font-family: 'Cormorant Garamond', serif; font-size: 13px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--gold); opacity: 0.85; }
    .badge { display: flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--stone); }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }

    .viewer-wrap { position: relative; width: 100%; height: 100vh; display: flex; flex-direction: column; }

    model-viewer {
      width: 100%; flex: 1;
      background: radial-gradient(ellipse at 50% 65%, #0d1829 0%, #070b12 55%, #030508 100%);
      --poster-color: transparent;
    }

    #ar-button {
      position: absolute; bottom: 28px; right: 28px;
      display: flex; align-items: center; gap: 10px;
      background: var(--blue); color: var(--white);
      border: none; border-radius: 50px;
      padding: 13px 22px;
      font-family: 'Jost', sans-serif; font-size: 13px; font-weight: 400;
      letter-spacing: 0.15em; text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 30px rgba(26,79,138,0.5);
      transition: all 0.25s ease;
    }
    #ar-button:hover { background: #2563b0; transform: translateY(-2px); box-shadow: 0 8px 40px rgba(26,79,138,0.6); }

    #loading-overlay {
      position: absolute; inset: 0; background: var(--deep);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; z-index: 10; transition: opacity 0.6s ease;
    }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 44px; height: 44px; border: 2px solid rgba(200,151,42,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-family: 'Cormorant Garamond', serif; font-size: 14px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--stone); }
    #error-msg { display: none; color: #ff6b6b; font-size: 13px; text-align: center; max-width: 300px; line-height: 1.6; }

    .info-panel { position: absolute; bottom: 28px; left: 28px; max-width: 360px; pointer-events: none; }
    .info-name { font-family: 'Cormorant Garamond', serif; font-size: clamp(26px, 4.5vw, 40px); font-weight: 300; line-height: 1.1; color: var(--white); margin-bottom: 6px; }
    .info-name em { font-style: italic; color: var(--gold); }
    .info-dates { font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--stone); margin-bottom: 14px; }
    .info-quote { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px; line-height: 1.7; color: rgba(238,240,245,0.6); border-left: 2px solid var(--accent); padding-left: 14px; }

    .gold-line { position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: 0.3; }
    .source-tag { position: absolute; top: 72px; left: 32px; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(122,135,153,0.5); }

    .controls-hint { position: absolute; top: 80px; right: 20px; display: flex; flex-direction: column; gap: 8px; opacity: 0.45; }
    .hint-item { display: flex; align-items: center; gap: 8px; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--stone); }
    .hint-icon { width: 28px; height: 28px; border: 1px solid rgba(122,135,153,0.35); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; }

    /* QR Panel */
    #qr-toggle {
      position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
      background: rgba(8,12,20,0.88); border: 1px solid rgba(200,151,42,0.3);
      border-radius: 50px; padding: 8px 16px;
      font-family: 'Jost', sans-serif; font-size: 11px; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--gold);
      cursor: pointer; z-index: 51; display: flex; align-items: center; gap: 7px;
      transition: all 0.2s; backdrop-filter: blur(8px);
    }
    #qr-toggle:hover { background: rgba(200,151,42,0.12); }
    #qr-toggle svg { width: 14px; height: 14px; }

    #qr-panel {
      position: absolute; top: 115px; left: 50%; transform: translateX(-50%);
      background: rgba(8,12,20,0.92); border: 1px solid rgba(200,151,42,0.22);
      border-radius: 14px; padding: 18px; display: none;
      flex-direction: column; align-items: center; gap: 11px;
      z-index: 50; backdrop-filter: blur(10px);
    }
    #qr-label { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--stone); }
    #qr-canvas { border-radius: 8px; display: block; }
    #qr-url { font-size: 10px; color: var(--gold); opacity: 0.7; }

    @media (max-width: 600px) {
      .controls-hint { display: none; }
      .info-panel { max-width: 260px; bottom: 16px; left: 16px; }
      #ar-button { bottom: 100px; right: 16px; }
      #qr-panel, #qr-toggle { display: none !important; }
    }
  </style>
</head>
<body>

<header>
  <span class="logo">Civil Rights Heritage Project</span>
  <span class="badge"><span class="badge-dot"></span>3D · AR Ready</span>
</header>

<div class="viewer-wrap">
  <div class="gold-line"></div>
  <span class="source-tag">3D Scan · AR Experience</span>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Loading model…</div>
    <div id="error-msg"></div>
  </div>

  <model-viewer
    id="viewer"
    src="./mlk_final.glb"
    ios-src="./mlk_statue.usdz"
    alt="Martin Luther King Jr. Statue"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    auto-rotate-delay="1000"
    rotation-per-second="7deg"
    shadow-intensity="1.3"
    shadow-softness="0.85"
    exposure="1.05"
    environment-image="neutral"
    touch-action="pan-y"
  >
    <button slot="ar-button" id="ar-button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 3H3v4M19 3h2v4M5 21H3v-4M19 21h2v-4"/>
        <rect x="7" y="7" width="10" height="10" rx="1"/>
      </svg>
      View in Your Space
    </button>
  </model-viewer>

  <div class="info-panel">
    <div class="info-name">Martin Luther<br><em>King Jr.</em></div>
    <div class="info-dates">Jan 15, 1929 — Apr 4, 1968</div>
    <div class="info-quote">
      "Darkness cannot drive out darkness;<br>
      only light can do that."
    </div>
  </div>

  <div class="controls-hint">
    <div class="hint-item"><div class="hint-icon">⟳</div>Drag to rotate</div>
    <div class="hint-item"><div class="hint-icon">⤢</div>Pinch to zoom</div>
  </div>

  <button id="qr-toggle" onclick="toggleQR()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
      <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="3" height="3"/>
    </svg>
    Scan QR
  </button>

  <div id="qr-panel">
    <div id="qr-label">Scan to open on phone</div>
    <canvas id="qr-canvas" width="160" height="160"></canvas>
    <div id="qr-url">your-repo.github.io/mlk-ar</div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  let qrGenerated = false;

  function toggleQR() {
    const panel = document.getElementById('qr-panel');
    const visible = panel.style.display === 'flex';
    panel.style.display = visible ? 'none' : 'flex';
    if (!qrGenerated && !visible) {
      qrGenerated = true;
      setTimeout(() => {
        const div = document.createElement('div');
        const qr = new QRCode(div, {
          text: window.location.href,
          width: 160, height: 160,
          colorDark: '#080C14', colorLight: '#EEF0F5',
          correctLevel: QRCode.CorrectLevel.H
        });
        setTimeout(() => {
          const src = div.querySelector('canvas')?.toDataURL() || div.querySelector('img')?.src;
          if (src) {
            const canvas = document.getElementById('qr-canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0, 160, 160);
            img.src = src;
          }
        }, 300);
      }, 50);
    }
  }

  const viewer = document.getElementById('viewer');
  const overlay = document.getElementById('loading-overlay');
  const errorMsg = document.getElementById('error-msg');

  viewer.addEventListener('load', () => overlay.classList.add('hidden'));

  viewer.addEventListener('error', (e) => {
    document.querySelector('.spinner').style.display = 'none';
    document.querySelector('.loading-text').style.display = 'none';
    errorMsg.style.display = 'block';
    errorMsg.textContent = 'Error: ' + (e.detail?.message || 'Failed to load model');
  });

  setTimeout(() => {
    if (!overlay.classList.contains('hidden')) {
      document.querySelector('.spinner').style.display = 'none';
      document.querySelector('.loading-text').style.display = 'none';
      errorMsg.style.display = 'block';
      errorMsg.textContent = 'Timed out — check the browser console for details.';
    }
  }, 20000);
</script>
</body>
</html>
